const {useState,useEffect,useRef,useCallback,useMemo} = React;

function RAGDemo() {
  const [query,setQuery] = useState('');
  const [step,setStep] = useState(0);
  const [docs,setDocs] = useState([]);
  const [answer,setAnswer] = useState('');
  const DOCS = [
    {title:'Relatório Q3 2024',score:0.94,chunk:'Receita cresceu 23% no terceiro trimestre...'},
    {title:'Análise de Mercado',score:0.87,chunk:'O setor de IA generativa atingiu R$2.4B...'},
    {title:'Estratégia 2025',score:0.81,chunk:'Expansão planejada para novos verticais...'},
  ];
  const ANSWERS = {
    '':null,
    default:'Com base nos 3 documentos mais relevantes recuperados, a análise indica crescimento consistente de 23% no Q3 2024, impulsionado pela expansão no setor de IA generativa que atingiu R$2.4B no mercado brasileiro.'
  };
  const run = async () => {
    if(!query.trim()) return;
    setStep(1); setDocs([]); setAnswer('');
    await delay(600); setStep(2);
    await delay(400); setDocs([DOCS[0]]);
    await delay(300); setDocs([DOCS[0],DOCS[1]]);
    await delay(300); setDocs([DOCS[0],DOCS[1],DOCS[2]]);
    await delay(500); setStep(3);
    await delay(800); setAnswer(ANSWERS.default);
  };
  const delay = ms => new Promise(r=>setTimeout(r,ms));
  const reset = () => {setStep(0);setDocs([]);setAnswer('');setQuery('');};
  return (
    <div className="space-y-3 text-sm">
      <div className="flex gap-2">
        <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&run()}
          placeholder="Digite uma pergunta sobre seus documentos..."
          className="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white placeholder-gray-500 text-xs focus:border-orange-500 transition"/>
        <button onClick={run} className="btn-primary text-xs px-3 py-2">🔍 RAG</button>
        {step>0&&<button onClick={reset} className="btn-ghost text-xs px-2 py-2">↺</button>}
      </div>
      {step>=1&&<div className="flex items-center gap-2 text-orange-400 text-xs"><span className={step>=1?"animate-spin":""}>⚙️</span> Embedding da query...</div>}
      {step>=2&&<div className="space-y-1">
        <div className="text-xs text-purple-400">📄 Documentos recuperados:</div>
        {docs.map((d,i)=>(
          <div key={i} className="bg-orange-500/10 border border-orange-500/20 rounded-lg p-2 animate-fade-in">
            <div className="flex justify-between text-xs"><span className="text-orange-300 font-medium">{d.title}</span><span className="text-green-400">score: {d.score}</span></div>
            <div className="text-gray-400 text-xs mt-1">{d.chunk}</div>
          </div>
        ))}
      </div>}
      {step>=3&&answer&&<div className="bg-green-500/10 border border-green-500/30 rounded-lg p-3">
        <div className="text-xs text-green-400 mb-1">✅ Resposta gerada pelo LLM:</div>
        <div className="text-gray-200 text-xs">{answer}</div>
      </div>}
    </div>
  );
}

function MLDemo() {
  const [vals,setVals] = useState({feature1:65,feature2:42,feature3:78,feature4:31});
  const score = useMemo(()=>{
    const s=(vals.feature1*0.4+vals.feature2*0.25+vals.feature3*0.2+vals.feature4*0.15)/100;
    return Math.min(0.98,Math.max(0.02,s+Math.random()*0.05-0.025));
  },[vals]);
  const label = score>0.7?'🔴 Alto Risco':score>0.4?'🟡 Médio Risco':'🟢 Baixo Risco';
  const features = [
    {name:'Recência (dias)',k:'feature1',max:100},
    {name:'Frequência',k:'feature2',max:100},
    {name:'Valor médio',k:'feature3',max:100},
    {name:'Suporte ativo',k:'feature4',max:100},
  ];
  return (
    <div className="space-y-3">
      {features.map(f=>(
        <div key={f.k}>
          <div className="flex justify-between text-xs text-gray-400 mb-1"><span>{f.name}</span><span className="text-white font-mono">{vals[f.k]}</span></div>
          <input type="range" min="0" max={f.max} value={vals[f.k]} onChange={e=>setVals(v=>({...v,[f.k]:+e.target.value}))}
            className="w-full accent-orange-500" style={{height:'4px'}}/>
        </div>
      ))}
      <div className="mt-3 bg-black/40 rounded-xl p-3 border border-white/10">
        <div className="flex justify-between items-center mb-2">
          <span className="text-xs text-gray-400">Probabilidade de Churn</span>
          <span className="text-xs font-bold">{label}</span>
        </div>
        <div className="w-full bg-gray-800 rounded-full h-3">
          <div className="h-3 rounded-full transition-all duration-500" style={{width:`${score*100}%`,background:`linear-gradient(90deg, ${score>0.7?'#ef4444':score>0.4?'#f59e0b':'#10b981'}, ${score>0.7?'#f97316':score>0.4?'#fbbf24':'#34d399'})`}}/>
        </div>
        <div className="text-right text-xs font-mono mt-1 text-gray-300">{(score*100).toFixed(1)}%</div>
      </div>
    </div>
  );
}

  const [running,setRunning] = useState(false);
  const [steps,setSteps] = useState([]);
  const STEPS = [

  ];
  const run = async () => {
    setRunning(true); setSteps([]);

      await new Promise(r=>setTimeout(r,700));

function NLPDemo() {
  const [text,setText] = useState('');
  const [result,setResult] = useState(null);
  const analyze = () => {
    if(!text.trim()) return;
    const words = text.toLowerCase().split(' ');
    const pos = ['ótimo','excelente','incrível','maravilhoso','perfeito','bom','gosto'].filter(w=>words.some(t=>t.includes(w)));
    const neg = ['ruim','péssimo','horrível','problema','erro','falha','difícil'].filter(w=>words.some(t=>t.includes(w)));
    const sentiment = pos.length>neg.length?'Positivo':neg.length>pos.length?'Negativo':'Neutro';
    const score = pos.length>neg.length?0.7+Math.random()*0.25:neg.length>pos.length?0.05+Math.random()*0.25:0.4+Math.random()*0.2;
    const entities = [];
    if(/\b[A-Z][a-z]+ [A-Z][a-z]+/.test(text)) entities.push({e:'Pessoa',t:'PER'});
    if(/\b(São Paulo|Rio|Brasil|Google|Apple|Amazon)\b/i.test(text)) entities.push({e:text.match(/\b(São Paulo|Rio|Brasil|Google|Apple|Amazon)\b/i)[0],t:'ORG/LOC'});
    setResult({sentiment,score,entities,tokens:text.split(' ').length,chars:text.length});
  };
  const colors = {Positivo:'text-green-400',Negativo:'text-red-400',Neutro:'text-yellow-400'};
  return (
    <div className="space-y-3">
      <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Digite um texto em português para analisar sentimento, entidades e classificação..."
        className="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white placeholder-gray-500 text-xs resize-none h-20 focus:border-orange-500 transition"/>
      <button onClick={analyze} className="btn-primary w-full text-xs">🧠 Analisar NLP</button>
      {result&&(
        <div className="grid grid-cols-2 gap-2">
          <div className="bg-black/30 border border-white/10 rounded-lg p-2">
            <div className="text-xs text-gray-400">Sentimento</div>
            <div className={`text-sm font-bold ${colors[result.sentiment]}`}>{result.sentiment}</div>
            <div className="text-xs text-gray-500">{(result.score*100).toFixed(0)}% conf.</div>
          </div>
          <div className="bg-black/30 border border-white/10 rounded-lg p-2">
            <div className="text-xs text-gray-400">Tokens/Chars</div>
            <div className="text-sm font-bold text-orange-400">{result.tokens}t / {result.chars}c</div>
          </div>
          {result.entities.length>0&&<div className="col-span-2 bg-purple-500/10 border border-purple-500/20 rounded-lg p-2">
            <div className="text-xs text-purple-400 mb-1">Entidades detectadas:</div>
            {result.entities.map((e,i)=><span key={i} className="tag bg-purple-500/20 text-purple-300 mr-1">{e.e} [{e.t}]</span>)}
          </div>}
        </div>
      )}
    </div>
  );
}

function ChartDemo() {
  const canvasRef = useRef(null);
  useEffect(()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    let frame = 0;
    const data = Array.from({length:30},(_,i)=>40+Math.sin(i*0.4)*20+Math.random()*10);
    const preds = Array.from({length:10},(_,i)=>data[data.length-1]+i*2+Math.random()*8);
    const animate = () => {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='rgba(10,10,20,0.4)';
      ctx.fillRect(0,0,W,H);
      // Grid
      ctx.strokeStyle='rgba(255,255,255,0.05)';
      ctx.lineWidth=1;
      for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Historical line
      const allPts = [...data,...preds];
      const minV = Math.min(...allPts)-5, maxV=Math.max(...allPts)+5;
      const scX=W/(allPts.length+2), scY=(H-20)/(maxV-minV);
      const toX=(i)=>scX*(i+1);
      const toY=(v)=>H-10-(v-minV)*scY;
      // Confidence band
      ctx.fillStyle='rgba(249,115,22,0.08)';
      ctx.beginPath();
      for(let i=0;i<preds.length;i++) ctx.lineTo(toX(data.length+i),(toY(preds[i])-8));
      for(let i=preds.length-1;i>=0;i--) ctx.lineTo(toX(data.length+i),(toY(preds[i])+8));
      ctx.fill();
      // Historical
      ctx.strokeStyle='#6366f1'; ctx.lineWidth=2;
      ctx.beginPath();
      data.forEach((v,i)=>{i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v));});
      ctx.stroke();
      // Forecast
      ctx.strokeStyle='#06b6d4'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(toX(data.length-1),toY(data[data.length-1]));
      preds.forEach((v,i)=>ctx.lineTo(toX(data.length+i),toY(v)));
      ctx.stroke(); ctx.setLineDash([]);
      // Labels
      ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='9px monospace';
      ctx.fillText('Histórico',8,14); ctx.fillStyle='#06b6d4'; ctx.fillText('Forecast',W*0.68,14);
      frame++;
      requestAnimationFrame(animate);
    };
    const raf = requestAnimationFrame(animate);
    return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={canvasRef} width={280} height={120} className="w-full rounded-lg demo-bg"/>;
}

function VisionDemo() {
  const canvasRef = useRef(null);
  useEffect(()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W=canvas.width, H=canvas.height;
    const boxes = [
      {x:20,y:20,w:80,h:60,label:'Defeito',conf:0.97,color:'#ef4444'},
      {x:150,y:40,w:60,h:50,label:'OK',conf:0.99,color:'#10b981'},
      {x:80,y:90,w:70,h:40,label:'Atenção',conf:0.84,color:'#f59e0b'},
    ];
    let frame = 0;
    const animate = () => {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
      // Grid overlay
      ctx.strokeStyle='rgba(249,115,22,0.1)'; ctx.lineWidth=1;
      for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Boxes
      boxes.forEach((b,i)=>{
        const pulse = Math.sin(frame*0.05+i)*0.3+0.7;
        ctx.strokeStyle=b.color; ctx.lineWidth=2;
        ctx.globalAlpha=pulse;
        ctx.strokeRect(b.x,b.y,b.w,b.h);
        ctx.fillStyle=b.color+'20';
        ctx.fillRect(b.x,b.y,b.w,b.h);
        ctx.globalAlpha=1;
        ctx.fillStyle=b.color; ctx.font='bold 9px sans-serif';
        ctx.fillRect(b.x,b.y-14,b.w,14);
        ctx.fillStyle='white';
        ctx.fillText(`${b.label} ${(b.conf*100).toFixed(0)}%`,b.x+2,b.y-3);
      });
      // Scan line
      const scanY = (frame*2)%H;
      ctx.strokeStyle='rgba(6,182,212,0.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,scanY); ctx.lineTo(W,scanY); ctx.stroke();
      frame++;
      requestAnimationFrame(animate);
    };
    const raf = requestAnimationFrame(animate);
    return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={canvasRef} width={280} height={140} className="w-full rounded-lg"/>;
}

function ChatDemo() {

  const [input,setInput] = useState('');
  const REPLIES = {
    default:'Com base na jurisprudência do STJ (REsp 1.234.567/SP) e no art. 422 do Código Civil, o princípio da boa-fé objetiva impõe ao fornecedor o dever de informação clara. Recomendo análise do contrato pelo ângulo do CDC.',
    clt:'Conforme CLT art. 477, o FGTS deve ser depositado em 10 dias do desligamento. Multa de 40% + aviso prévio são devidos neste caso.',
    lgpd:'O tratamento de dados pessoais sensíveis exige consentimento específico (art. 11 LGPD). Recomendo incluir cláusula de DPA e indicar o encarregado (DPO).',
  };
  const send = async () => {
    if(!input.trim()) return;
    setMsgs(m=>[...m,{r:'user',t:input}]);
    const q = input.toLowerCase();
    setInput('');
    await new Promise(r=>setTimeout(r,800));
    const rep = q.includes('clt')||q.includes('trabalhist')?REPLIES.clt:q.includes('lgpd')||q.includes('dados')?REPLIES.lgpd:REPLIES.default;
    setMsgs(m=>[...m,{r:'bot',t:rep}]);
  };
  return (
    <div className="space-y-2">
      <div className="h-28 overflow-y-auto space-y-2 scrollbar-none">
        {msgs.map((m,i)=>(
          <div key={i} className={`flex ${m.r==='user'?'justify-end':''}`}>

          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}

        <button onClick={send} className="btn-primary text-xs px-2 py-1.5">→</button>
      </div>
    </div>
  );
}

function Stars({value,onChange,size=20}){
  const [hover,setHover]=useState(0);
  return (<div className="inline-flex gap-0.5">{[1,2,3,4,5].map(s=>(
    <span key={s} onClick={()=>onChange&&onChange(s)} onMouseEnter={()=>onChange&&setHover(s)} onMouseLeave={()=>setHover(0)}

    {n:'James Carter',r:5,c:'Best AI portfolio I have seen. The live, testable apps are a game changer.',d:'2025-09-10'},
  ];
  const [list,setList]=useState(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.length?s:seed;}catch(e){return seed;}});
  const [name,setName]=useState(''),[msg,setMsg]=useState(''),[rating,setRating]=useState(5),[sent,setSent]=useState(false);

  const avg=(list.reduce((a,b)=>a+b.r,0)/Math.max(list.length,1)).toFixed(1);
  return (<section className={`px-4 sm:px-8 py-16 ${dark?'':'bg-white'}`}><div className="max-w-3xl mx-auto">
    <div className="text-center mb-8">
      <h2 className="text-3xl font-black mb-2"><span className="gradient-text">{t('cm_title')}</span></h2>

      </div>
    </div>
    <div className={`rounded-2xl p-5 mb-6 ${dark?'glass':'bg-white shadow-md border border-gray-100'}`}>

        <div className={`flex items-center gap-2 px-3 py-2 rounded-xl ${dark?'bg-white/5':'bg-gray-50'}`}><span className={`text-xs ${dark?'text-gray-400':'text-gray-500'}`}>{t('cm_rate')}</span><Stars value={rating} onChange={setRating}/></div>
      </div>
      <textarea value={msg} onChange={e=>setMsg(e.target.value)} placeholder={t('cm_msg')} className={`w-full px-3 py-2.5 rounded-xl text-sm border resize-none h-20 mb-3 ${dark?'bg-white/5 border-white/10 text-white placeholder-gray-500':'bg-gray-50 border-gray-200 text-gray-800'}`}/>
      <div className="flex items-center justify-between">

      <div key={i} className={`rounded-2xl p-4 ${dark?'glass':'bg-white shadow-sm border border-gray-100'}`}>
